<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帧鉴 · Cinegraph</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<input type="file" id="fileInput" accept="video/*,.mkv,.avi,.flv,.ts,.m4v,.wmv" style="display:none">

<div id="app">

  <header>
    <div class="brand">帧鉴<em>Cinegraph</em></div>
    <div class="ptitle" id="projTitle">未打开影片</div>
    <div class="acts">
      <button id="btnOpen" title="Ctrl+O">打开影片</button>
      <button id="btnSave" title="Ctrl+S">保存</button>
      <button id="btnExport">导出</button>
      <button id="btnReanalyze" title="用不同灵敏度重新检测镜头">重新分镜</button>
      <input id="thr" class="thr" type="range" min="0.10" max="0.60" step="0.02" value="0.28" title="检测灵敏度">
      <span class="thrval" id="thrVal">0.28</span>
      <button id="btnKeys" title="快捷键设置 (?)">⌨ 快捷键</button>
    </div>
    <div class="status" id="status">就绪</div>
  </header>

  <main>
    <section class="stage">
      <div class="videoWrap" id="videoWrap">
        <video id="video" preload="auto" playsinline></video>
        <div class="empty" id="dropzone">
          <div class="emptyIcon">🎬</div>
          <h2>把视频拖进这个窗口</h2>
          <p class="sub">或者 <button class="link" id="btnPick2">点击选择文件</button>　·　mp4 / mov / mkv / avi / webm</p>
          <div class="recent" id="recent"></div>
          <p class="tip">分镜、抽帧、波形全部在本机计算，不上传任何服务器　·　<button class="link" id="btnBrowse">改用路径浏览</button></p>
        </div>
        <div class="hud" id="hud"></div>
      </div>
      <div class="transport">
        <button id="btnPrevShot" title="上一镜 [">⏮</button>
        <button id="btnFrameBack" title="退一帧 ,">◀|</button>
        <button id="btnPlay" class="play" title="播放/暂停 空格">▶</button>
        <button id="btnFrameFwd" title="进一帧 .">|▶</button>
        <button id="btnNextShot" title="下一镜 ]">⏭</button>
        <span class="tc" id="tc">00:00:00.00</span>
        <span class="spacer"></span>
        <label class="sp">速度 <select id="speed">
          <option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option>4</option>
        </select></label>
        <label class="sp">音量 <input id="vol" type="range" min="0" max="1" step="0.05" value="1" style="width:70px"></label>
        <span class="hint" id="shotInfo"></span>
      </div>
    </section>

    <div class="splitter v" id="splitV" title="拖动调整侧栏宽度 · 双击复位"></div>

    <aside class="side">
      <div class="sideHead">
        <span id="sideTitle">镜头表</span>
        <input id="filter" placeholder="筛选…" class="filter">
        <span class="cnt" id="shotCount">0</span>
      </div>
      <div class="shotList" id="shotList"></div>
      <div class="editor" id="editor">
        <div class="empty">点击时间线上的镜头块，或按 <kbd>S</kbd> 在当前帧新建镜头</div>
      </div>
    </aside>
  </main>

  <div class="splitter h" id="splitH" title="拖动调整时间线高度 · 双击复位"></div>

  <section class="tlwrap">
    <div class="tlhead">
      <span>时间线</span>
      <span class="tlhint">滚轮缩放 · 拖动平移 · 点击定位</span>
      <span class="spacer"></span>
      <button id="btnFit" class="mini" title="全片 F">全片</button>
      <span class="zoombox">
        <button id="btnZoomOut" class="mini zoomb" title="缩小">−</button>
        <input id="zoomSlider" type="range" min="0" max="1000" value="0" title="拖动缩放时间线">
        <button id="btnZoomIn" class="mini zoomb" title="放大">＋</button>
      </span>
      <span class="zoomval" id="zoomVal">全片</span>
    </div>
    <canvas id="tl"></canvas>
  </section>

</div>

<div class="mask" id="mask">
  <div class="dialog" id="dialog"></div>
</div>

<script src="/web/timeline.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
